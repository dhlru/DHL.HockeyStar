<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ДХЛ — Обновление 7.7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-red: #ff0033;
            --accent-blue: #0066ff;
            --accent-cyan: #00ccff;
            --text-white: #ffffff;
            --text-gray: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ---- Фоновое фото ---- */
        .bg {
            position: fixed;
            inset: 0;
            background-image: url('https://i.ibb.co/FkB6zZYj/IMG-20261002-194002.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            animation: bgZoom 30s ease-in-out infinite alternate;
        }

        @keyframes bgZoom {
            from { transform: scale(1); }
            to   { transform: scale(1.08); }
        }

        /* ---- Затемнение поверх фото ---- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.85) 70%, #000 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.75) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* ---- Плёночные вертикальные полосы (эффект кино) ---- */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.02) 0px,
                rgba(255, 255, 255, 0.02) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: overlay;
        }

        /* ---- Основной контент ---- */
        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 40px 24px;
            max-width: 900px;
            width: 100%;
            animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- Верхний бейдж ---- */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 0, 51, 0.5);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.35), inset 0 0 20px rgba(255, 0, 51, 0.1);
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
        }

        .badge i {
            color: var(--accent-red);
            font-size: 0.9rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(1.15); }
        }

        /* ---- Заголовок "ОБНОВЛЕНИЕ 7.7" ---- */
        .title {
            font-family: 'Oswald', sans-serif;
            font-weight: 900;
            font-size: clamp(2.2rem, 8vw, 5.6rem);
            line-height: 0.95;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 45%, #7a7a7a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
            margin-bottom: 8px;
            position: relative;
        }

        /* ---- Подзаголовок "НОВЫЙ ПУТЬ" ---- */
        .subtitle {
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: clamp(1.2rem, 4.5vw, 2.6rem);
            letter-spacing: 14px;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-blue), var(--accent-cyan));
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradientMove 6s ease-in-out infinite;
            margin-bottom: 40px;
            padding-left: 14px;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        /* ---- Таймер ---- */
        .timer {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2vw, 18px);
            margin-bottom: 36px;
            flex-wrap: nowrap;
        }

        .cell {
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.85), rgba(5, 5, 5, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: clamp(12px, 2.5vw, 22px) clamp(8px, 2vw, 20px);
            min-width: clamp(72px, 18vw, 130px);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 20px 40px -20px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 51, 0.6), rgba(0, 102, 255, 0.6), transparent);
        }

        .cell .num {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(1.8rem, 6.5vw, 3.4rem);
            line-height: 1;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
        }

        .cell .lbl {
            font-size: clamp(0.55rem, 1.5vw, 0.7rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #6e6e6e;
            margin-top: 10px;
            font-weight: 500;
        }

        .colon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.25);
            padding: 0 2px;
            animation: colonBlink 1s steps(1) infinite;
        }

        @keyframes colonBlink {
            0%, 50%   { opacity: 1; }
            51%, 100% { opacity: 0.25; }
        }

        /* ---- Дата и время ---- */
        .date-info {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.8rem, 2.2vw, 1.05rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .date-info i {
            color: var(--accent-red);
            font-size: 0.9rem;
        }

        .date-info .sep {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 300;
        }

        /* ---- Нижняя подпись ---- */
        .footnote {
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #4a4a4a;
            font-family: 'Oswald', sans-serif;
        }

        .footnote i {
            color: var(--accent-blue);
            margin-right: 8px;
        }

        /* ---- Мобильная адаптация ---- */
        @media (max-width: 600px) {
            .subtitle { letter-spacing: 8px; padding-left: 8px; }
            .badge { font-size: 0.6rem; letter-spacing: 3px; padding: 6px 14px; }
            .date-info { gap: 8px; letter-spacing: 2px; }
        }

        /* ---- Свечение за таймером ---- */
        .glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            max-width: 900px;
            max-height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 51, 0.15) 0%, rgba(0, 102, 255, 0.10) 40%, transparent 70%);
            filter: blur(80px);
            z-index: 2;
            pointer-events: none;
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50%      { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }

        /* ---- Красная кромка снизу ---- */
        .edge-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-red), var(--accent-blue), var(--accent-red), transparent);
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.7);
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div class="glow"></div>
    <div class="overlay"></div>
    <div class="scanlines"></div>

    <div class="content">
        <div class="badge">
            <i class="fas fa-bolt"></i>
            Скоро запуск
            <i class="fas fa-bolt"></i>
        </div>

        <h1 class="title">Обновление 7.7</h1>
        <h2 class="subtitle">Новый путь</h2>

        <div class="timer" id="timer">
            <div class="cell">
                <div class="num" id="days">00</div>
                <div class="lbl">Дней</div>
            </div>
            <div class="colon">:</div>
            <div class="cell">
                <div class="num" id="hours">00</div>
                <div class="lbl">Часов</div>
            </div>
            <div class="colon">:</div>
            <div class="cell">
                <div class="num" id="minutes">00</div>
                <div class="lbl">Минут</div>
            </div>
            <div class="colon">:</div>
            <div class="cell">
                <div class="num" id="seconds">00</div>
                <div class="lbl">Секунд</div>
            </div>
        </div>

        <div class="date-info">
            <span><i class="fas fa-calendar-day"></i> 3 октября</span>
            <span class="sep">/</span>
            <span><i class="fas fa-clock"></i> 17:00</span>
            <span class="sep">/</span>
            <span><i class="fas fa-map-marker-alt"></i> Новокузнецк</span>
        </div>

        <div class="footnote">
            <i class="fas fa-dragon"></i> Дворовая Хоккейная Лига
        </div>
    </div>

    <div class="edge-bottom"></div>

    <script>
        // Дата запуска: 3 октября 2026, 17:00 по новокузнецкому времени (UTC+7)
        // В UTC это: 3 октября 2026, 10:00 UTC
        const targetDate = new Date('2026-10-03T17:00:00+07:00').getTime();

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        function pad(num) {
            return num < 10 ? '0' + num : '' + num;
        }

        function updateTimer() {
            const now = Date.now();
            const diff = targetDate - now;

            if (diff <= 0) {
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            daysEl.textContent = pad(days);
            hoursEl.textContent = pad(hours);
            minutesEl.textContent = pad(minutes);
            secondsEl.textContent = pad(seconds);
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>

</body>
</html>
